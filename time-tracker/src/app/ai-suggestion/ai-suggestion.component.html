<div class="container mt-4">
  <!-- Error Message -->
  <div *ngIf="errorMessage" class="alert alert-danger" role="alert">
    {{ errorMessage }}
  </div>

  <!-- Month Selector -->
  <div class="form-group">
    <label for="monthSelect">Select a month:</label>
    <input type="month" id="monthSelect" class="form-control" [(ngModel)]="selectedMonth" (change)="onMonthChange($event)">
  </div>

  <!-- Submit Button -->
  <button class="btn btn-primary mt-3" (click)="onSubmit()">Get AI Suggestion</button>

  <!-- Bank Holidays Section -->
  <div class="bank-holidays mt-4 p-3 border rounded shadow-sm bg-light">
    <h3 class="mb-3">Bank Holidays</h3>
    <ul>
      <li *ngFor="let holiday of bankHolidays">{{ holiday.name }}: {{ holiday.date | date: 'fullDate' }}</li>
    </ul>
  </div>

  <!-- Potential Schedules Section -->
  <div class="potential-schedules mt-4 p-3 border rounded shadow-sm bg-light">
    <h3 class="mb-3">Potential Schedules</h3>
    <ul>
      <li *ngFor="let schedule of potentialSchedules">{{ schedule }}</li>
    </ul>
  </div>

  <!-- Calendar Section -->
  <div class="calendar mt-4 p-3 border rounded shadow-sm bg-light">
    <h3 class="mb-3">Calendar</h3>
    <div class="calendar-grid">
      <!-- Header Days (Sun - Sat) -->
      <div class="calendar-header">Sun</div>
      <div class="calendar-header">Mon</div>
      <div class="calendar-header">Tue</div>
      <div class="calendar-header">Wed</div>
      <div class="calendar-header">Thu</div>
      <div class="calendar-header">Fri</div>
      <div class="calendar-header">Sat</div>

      <!-- Calendar Days -->
      <div *ngFor="let day of calendarDays" [ngClass]="{
        'empty-day': day.type === 'empty',
        'holiday-day': day.type === 'holiday',
        'anticipated-day': day.type === 'anticipated',
        'normal-day': day.type === 'normal'
      }" class="calendar-day">
        {{ day.day }}
      </div>
    </div>
  </div>

  <!-- Add Anticipated Date Section -->
  <div class="mt-4">
    <h4>Add Anticipated Dates</h4>
    <div class="input-group mb-3">
      <input type="date" class="form-control" id="anticipatedDateInput" #anticipatedDate>
      <div class="input-group-append">
        <button class="btn btn-outline-secondary" (click)="addDate('anticipated', anticipatedDate.value)">Add Anticipated Date</button>
      </div>
    </div>
  </div>

  <!-- Summary Section -->
  <div class="summary mt-4 p-3 border rounded shadow-sm bg-light">
    <h3 class="mb-3">Summary</h3>
    <ul>
      <li *ngFor="let line of summary">{{ line }}</li>
    </ul>
  </div>
</div>

<!-- Styles for calendar -->
<style>
  .calendar {
    display: flex;
    flex-direction: column;
    align-items: center;
  }

  .calendar-grid {
    display: grid;
    grid-template-columns: repeat(7, 1fr);
    gap: 10px;
    width: 100%;
  }

  .calendar-header {
    text-align: center;
    font-weight: bold;
  }

  .calendar-day {
    text-align: center;
    padding: 10px;
    border: 1px solid #ddd;
    border-radius: 4px;
  }

  .empty-day {
    background-color: #f8f9fa;
  }

  .holiday-day {
    background-color: red;
    color: white;
  }

  .anticipated-day {
    background-color: yellow;
  }

  .normal-day {
    background-color: #f0f0f0;
  }
</style>
